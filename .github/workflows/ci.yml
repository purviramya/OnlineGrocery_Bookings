# Runs on every push and pull request. Render redeploys from `main` on its own (autoDeploy);
# this workflow tells you whether the commit builds before/while that happens.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Syntax-check server files
        run: for f in server/*.js; do node --check "$f"; done
